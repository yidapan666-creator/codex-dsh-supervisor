<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 604" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dsh-supervision-workflow-title dsh-supervision-workflow-desc">
      <title id="dsh-supervision-workflow-title">Codex DSH Supervisor durable workflow</title>
      <desc id="dsh-supervision-workflow-desc">Architecture showing a task moving from the user through Codex and its MCP gateway into an independent DSH Host, where one Root and its children work in a scoped Git worktree while durable state enables observation and reconnect.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones first -->
      <rect x="200" y="144" width="368" height="168" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <rect x="232" y="136" width="304" height="24" rx="2" fill="#f5f5f5"/>
      <text x="384" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CODEX SIDE · SUPERVISION</text>

      <rect x="584" y="144" width="576" height="344" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <rect x="688" y="136" width="368" height="24" rx="2" fill="#f5f5f5"/>
      <text x="872" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DSH SIDE · EXECUTION</text>

      <!-- Connectors before nodes -->
      <line x1="184" y1="216" x2="216" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="216" y1="248" x2="184" y2="248" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="376" y1="216" x2="408" y2="216" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="568" y1="216" x2="600" y2="216" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="760" y1="216" x2="792" y2="216" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="952" y1="216" x2="984" y2="216" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Five-minute observation and reconnect path -->
      <path d="M 704,184 V 120 Q 704,112 696,112 H 304 Q 296,112 296,120 V 184" fill="none" stroke="#2e5aa8" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>

      <!-- Host-owned durable services -->
      <line x1="648" y1="264" x2="648" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M 712,264 V 296 Q 712,304 720,304 H 864 Q 872,304 872,312 V 360" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Arrow labels with visible margin -->
      <rect x="184" y="196" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">TASK</text>
      <rect x="184" y="228" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="200" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RESULT</text>
      <rect x="376" y="196" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="392" y="204" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">MCP</text>
      <rect x="568" y="196" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="584" y="204" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">AUTH</text>
      <rect x="760" y="196" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="776" y="204" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ADMIT</text>
      <rect x="952" y="196" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="968" y="204" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">WRITE</text>
      <rect x="444" y="92" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="100" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">OBSERVE / RECOVER</text>
      <rect x="656" y="312" width="52" height="12" rx="2" fill="#f5f5f5"/>
      <text x="682" y="320" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PERSIST</text>
      <rect x="780" y="284" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="812" y="292" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">SERVE UI</text>

      <!-- User -->
      <rect x="24" y="184" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="24" y="184" width="160" height="80" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#7a8399" stroke-width="1"/>
      <rect x="32" y="192" width="32" height="12" rx="2" fill="none" stroke="#7a8399" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="48" y="200" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">INPUT</text>
      <text x="104" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>
      <text x="104" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">intent · scope · budget</text>

      <!-- Codex supervisor -->
      <rect x="216" y="184" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="216" y="184" width="160" height="80" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="224" y="192" width="32" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="240" y="200" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CTRL</text>
      <text x="296" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Codex Supervisor</text>
      <text x="296" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">compile · steer · review</text>

      <!-- MCP gateway -->
      <rect x="408" y="184" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="408" y="184" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="416" y="192" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="432" y="200" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">MCP</text>
      <text x="488" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dsh-gate</text>
      <text x="488" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">network client · policy</text>

      <!-- DSH Host -->
      <rect x="600" y="184" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="184" width="160" height="80" rx="6" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <rect x="608" y="192" width="40" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="628" y="200" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HOST</text>
      <text x="680" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Durable DSH Host</text>
      <text x="680" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">independent process</text>

      <!-- Root and children -->
      <rect x="792" y="184" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="792" y="184" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="800" y="192" width="40" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="820" y="200" fill="#2d3142" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ROOT</text>
      <text x="872" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Root + children</text>
      <text x="872" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one owner · ≤5 direct</text>

      <!-- Worktree -->
      <rect x="984" y="184" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="984" y="184" width="160" height="80" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="992" y="192" width="32" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="1008" y="200" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">GIT</text>
      <text x="1064" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scoped worktree</text>
      <text x="1064" y="244" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">one writer per tree</text>

      <!-- Durable state -->
      <rect x="600" y="360" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="600" y="360" width="160" height="80" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <rect x="608" y="368" width="40" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="628" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STATE</text>
      <text x="680" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Durable control state</text>
      <text x="680" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">runs · budget · leases</text>

      <!-- Web UI -->
      <rect x="792" y="360" width="160" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="792" y="360" width="160" height="80" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="800" y="368" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.30" stroke-width="0.8"/>
      <text x="816" y="376" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">WEB</text>
      <text x="872" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DSH Web</text>
      <text x="872" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">live session view</text>

      <!-- Legend -->
      <line x1="24" y1="520" x2="1176" y2="520" stroke="#2d3142" stroke-opacity="0.12" stroke-width="0.8"/>
      <text x="24" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEGEND</text>
      <rect x="24" y="560" width="16" height="12" rx="2" fill="#eb6c36" fill-opacity="0.08" stroke="#eb6c36" stroke-width="1"/>
      <text x="48" y="572" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Supervision / execution boundary</text>
      <rect x="280" y="560" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="304" y="572" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Service / agent</text>
      <rect x="432" y="560" width="16" height="12" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
      <text x="456" y="572" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Durable state</text>
      <line x1="584" y1="568" x2="616" y2="568" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="624" y="572" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Protocol / observation</text>
      <line x1="800" y1="568" x2="832" y2="568" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="840" y="572" fill="#4f5d75" font-size="8" font-family="'Geist', sans-serif">Return / reconnect</text>
    </svg>
